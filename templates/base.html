<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="Физика 9 класс: явления, термины, формулы и шпаргалки.">
  <title>{% block title %}Физика 9 — учись понятно{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script defer src="{{ url_for('static', filename='js/main.js') }}"></script>
</head>
<body>
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}"><span class="brand-mark">φ</span><span>ФИЗИКА<span class="brand-muted">9</span></span></a>
    <button class="menu-toggle" aria-label="Открыть меню" aria-expanded="false">☰</button>
    <nav class="nav-links">
      <a href="{{ url_for('phenomena') }}">Явления</a>
      <a href="{{ url_for('terms') }}">Термины</a>
      <a href="{{ url_for('formulas') }}">Формулы</a>
      <a href="{{ url_for('cheatsheets') }}">Шпаргалки</a>
      <a class="nav-quiz" href="{{ url_for('quiz') }}">Мини-тест ↗</a>
    </nav>
  </header>
  <main class="page-shell">{% block content %}{% endblock %}</main>
  <footer class="footer">
    <a class="brand footer-brand" href="{{ url_for('index') }}"><span class="brand-mark">φ</span><span>ФИЗИКА<span class="brand-muted">9</span></span></a>
    <p>Понимай явления. Запоминай формулы. Решай увереннее.</p>
    <span>© {{ current_year }} · Учебный проект для 9 класса</span>
  </footer>
</body>
</html>
